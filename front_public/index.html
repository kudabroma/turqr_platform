<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title — динамически меняется через React -->
    <title>TurQR — Digital Menu</title>

    <!-- SEO -->
    <meta
      name="description"
      content="View the digital menu of this restaurant — prices, photos, and dishes in your language."
    />
    <meta name="author" content="TurQR Platform" />

    <!-- Не индексировать отдельные страницы меню — индексируется только каталог -->
    <meta name="robots" content="noindex, follow" />

    <!-- Open Graph — меняется динамически через react-helmet или useEffect -->
    <meta property="og:title" content="TurQR — Digital Menu" />
    <meta property="og:description" content="View the digital menu — prices, photos, and dishes in your language." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png?v=3" />

    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body style="font-family: 'Manrope', sans-serif;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
